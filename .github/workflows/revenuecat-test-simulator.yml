name: RevenueCat Test Store simulator

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/revenuecat-test-simulator.yml'
      - 'tools/build-revenuecat-test.mjs'
      - 'src/utils/revenueCatTestStore.ts'
      - 'src/utils/revenueCatTestProbe.ts'
      - 'src/main.tsx'
      - 'src/components/RevenueCatTestPanel.tsx'
      - 'src/components/ShopAndMadaModal.tsx'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  test-store-build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # This is the public key of this project's synthetic Test Store, not a secret or an App Store key.
      VITE_REVENUECAT_TEST_KEY: test_WIosChYdpimDTrZuRpZpzZldcpx
      VITE_REVENUECAT_TEST_PROBE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build isolated Test Store assets
        run: npm run build:revenuecat-test
      - name: Sync test bundle in the ephemeral CI checkout
        run: |
          node -e 'const fs=require("fs"); const file="capacitor.config.json"; const config=JSON.parse(fs.readFileSync(file,"utf8")); config.webDir="build/revenuecat-test"; fs.writeFileSync(file,JSON.stringify(config,null,2));'
          npx cap sync ios
      - name: Compile Test Store simulator app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/qahwa-test-store" CODE_SIGNING_ALLOWED=NO build
      - name: Select iOS simulator
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | node -e 'let s=""; process.stdin.on("data", c => s += c); process.stdin.on("end", () => { const d=JSON.parse(s).devices; const phone=Object.entries(d).filter(([runtime]) => runtime.includes("SimRuntime.iOS")).flatMap(([, devices]) => devices).find(device => device.isAvailable && device.name.startsWith("iPhone")); if (!phone) process.exit(1); console.log(phone.udid); });')
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
      - name: Boot iOS simulator
        timeout-minutes: 8
        run: |
          xcrun simctl boot "$SIMULATOR_ID"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
      - name: Install Test Store app
        timeout-minutes: 4
        run: |
          xcrun simctl install "$SIMULATOR_ID" "$RUNNER_TEMP/qahwa-test-store/Build/Products/Debug-iphonesimulator/App.app"
      - name: Launch and check Test Store offerings
        id: probe
        timeout-minutes: 4
        run: |
          xcrun simctl launch --console "$SIMULATOR_ID" sa.qahwamajlis.merge > "$RUNNER_TEMP/qahwa-test-console.log" 2>&1 &
          LAUNCH_PID=$!
          trap 'kill "$LAUNCH_PID" >/dev/null 2>&1 || true' EXIT
          RESULT=timeout
          for attempt in $(seq 1 60); do
            if grep -q 'QAHWA_TEST_STORE_OFFERINGS_OK' "$RUNNER_TEMP/qahwa-test-console.log"; then RESULT=success; break; fi
            if grep -q 'QAHWA_TEST_STORE_OFFERINGS_FAILED' "$RUNNER_TEMP/qahwa-test-console.log"; then RESULT=probe_failed; break; fi
            if ! kill -0 "$LAUNCH_PID" 2>/dev/null; then RESULT=launch_ended; break; fi
            sleep 2
          done
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          echo "Test Store probe result: $RESULT. No transaction was attempted." | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$RESULT" != success ]; then exit 0; fi
          echo 'Test Store returned all three expected packages.' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Fail when offerings probe reports an error
        if: steps.probe.outputs.result == 'probe_failed'
        run: exit 1
      - name: Fail when app exits before offerings are checked
        if: steps.probe.outputs.result == 'launch_ended'
        run: exit 1
      - name: Fail when offerings probe times out
        if: steps.probe.outputs.result == 'timeout'
        run: exit 1
      - name: Capture test app screenshot
        timeout-minutes: 2
        run: xcrun simctl io "$SIMULATOR_ID" screenshot "$RUNNER_TEMP/qahwa-test-store.png"
      - name: Save launch screenshot
        uses: actions/upload-artifact@v4
        with:
          name: revenuecat-test-store-launch
          path: ${{ runner.temp }}/qahwa-test-store.png
          if-no-files-found: error
