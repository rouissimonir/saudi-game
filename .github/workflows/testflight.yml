name: TestFlight build

# Builds a signed release of the iOS app on a cloud Mac and uploads it to App Store Connect (TestFlight).
# Runs automatically on every push to main that changes the app (source, assets, iOS project, dependencies or
# this workflow), and by hand: Actions > TestFlight build > Run workflow. Docs, tests-only and tooling changes
# do not trigger a build; add [skip ci] to a commit message to skip one that would. The lint and tests run first,
# so a failing main never uploads. Each run's number is the build number, so they are always unique and rising.
# It needs these repository secrets
# (Settings > Environments > dev > Environment secrets), see docs/TESTFLIGHT.md for how to get each one:
#   ASC_KEY_ID       App Store Connect API key ID
#   ASC_ISSUER_ID    App Store Connect API issuer ID
#   ASC_KEY_P8       the full text of the downloaded AuthKey_XXXX.p8 file
#   APPLE_TEAM_ID    the 10-character Apple developer Team ID
#   REVENUECAT_IOS_KEY   (optional) RevenueCat public App Store key, starts with appl_
# Without REVENUECAT_IOS_KEY the build ships without RevenueCat (no purchases, nothing contacts RevenueCat).
# The key is passed to the build only when 'daily_packs' or 'sandbox_purchase_test' is ticked on a manual run, so
# automatic builds and the 1.0 release build are no-purchase builds (docs/APP_STORE_SUBMISSION.md, section 9, Option A).

'on':
  workflow_dispatch:
    inputs:
      sandbox_purchase_test:
        description: 'Include the sandbox-only purchase diagnostic (never submit this build for release)'
        type: boolean
        default: false
      daily_packs:
        description: 'Show the daily paid pack offer (sandbox purchases in TestFlight; needs REVENUECAT_IOS_KEY; never submit for release until verified)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/testflight.yml'
      - 'ios/**'
      - 'src/**'
      - 'public/**'
      - 'tools/check-ios-assets.mjs'
      - 'capacitor.config.json'
      - 'index.html'
      - 'fasih.html'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'

# One upload at a time, in order. A build that has started is never cancelled halfway through signing or upload.
concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-26
    environment: dev
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # The key reaches the build only when a purchase option is switched on by hand, so every automatic
      # (push) build is a no-purchase build that never configures RevenueCat, whatever the secret holds.
      VITE_REVENUECAT_IOS_KEY: ${{ (inputs.daily_packs || inputs.sandbox_purchase_test) && secrets.REVENUECAT_IOS_KEY || '' }}
      VITE_APPLE_SANDBOX_PURCHASE_TEST: ${{ inputs.sandbox_purchase_test && '1' || '0' }}
      VITE_DAILY_PACKS: ${{ inputs.daily_packs && '1' || '0' }}
    steps:
      - name: Check the signing secrets exist
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then echo "Missing GitHub secrets:$missing (see docs/TESTFLIGHT.md)"; exit 1; fi
          if [ -n "$VITE_REVENUECAT_IOS_KEY" ]; then
            if [[ ! "$VITE_REVENUECAT_IOS_KEY" =~ ^appl_[A-Za-z0-9]+$ ]]; then
              echo "REVENUECAT_IOS_KEY must be a valid RevenueCat public App Store key"; exit 1
            fi
            echo "RevenueCat initialization is enabled. Paid game benefits are not implemented."
          else
            if [ "$VITE_APPLE_SANDBOX_PURCHASE_TEST" = 1 ]; then echo "Sandbox purchase test requires REVENUECAT_IOS_KEY."; exit 1; fi
            if [ "$VITE_DAILY_PACKS" = 1 ]; then echo "Daily packs require REVENUECAT_IOS_KEY."; exit 1; fi
            echo "No RevenueCat key: initialization and purchases are unavailable."
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies and run the checks
        run: |
          npm ci
          npm run lint
          npm test
      - name: Build the web app and sync the iOS project
        run: |
          npm run build
          npx cap sync ios
          npm run check:ios-assets
      - name: Install the saved signing certificate (if set up)
        # One Apple Distribution certificate and profile created once by "Apple signing bootstrap" and kept as secrets,
        # so no new certificate is created per build. Without those secrets the build falls back to cloud signing.
        id: saved
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          DIST_PROFILE_BASE64: ${{ secrets.DIST_PROFILE_BASE64 }}
        run: |
          if [ -z "$DIST_CERT_P12_BASE64" ] || [ -z "$DIST_PROFILE_BASE64" ]; then
            echo "use=false" >> "$GITHUB_OUTPUT"
            echo "No saved signing certificate: using cloud signing."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -P "$DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "$DIST_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "use=true" >> "$GITHUB_OUTPUT"
          echo "name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          echo "Using the saved certificate and profile \"$PROFILE_NAME\"."
      - name: Archive and sign (saved certificate)
        if: steps.saved.outputs.use == 'true'
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="${{ steps.saved.outputs.name }}" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive
      - name: Export and upload to TestFlight (saved certificate)
        if: steps.saved.outputs.use == 'true'
        run: |
          mkdir -p "$HOME/private_keys"
          KEY_FILE="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_FILE"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>sa.qahwamajlis.merge</key><string>${{ steps.saved.outputs.name }}</string></dict>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$KEY_FILE" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Clear stale development certificates left by earlier runs
        # Cloud signing makes a new "Apple Development: Created via API" certificate on every fresh runner and Apple caps
        # how many an account may hold; at the cap signing fails. Removing the old ones keeps the count at one.
        # Distribution certificates are never touched (tools/apple-certs.mjs). A failure here must not stop the build.
        if: steps.saved.outputs.use != 'true'
        continue-on-error: true
        run: node tools/apple-certs.mjs clean --delete
      - name: Archive and sign (cloud signing with the App Store Connect key)
        if: steps.saved.outputs.use != 'true'
        run: |
          mkdir -p "$HOME/private_keys"
          KEY_FILE="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_FILE"
          xcodebuild -version
          set -o pipefail
          if ! xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_FILE" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive 2>&1 | tee "$RUNNER_TEMP/archive.log"; then
            if grep -q "maximum number of certificates" "$RUNNER_TEMP/archive.log"; then
              echo "::error title=Apple certificate limit reached::The Apple account has too many signing certificates, so cloud signing cannot create another. Revoke unused ones at developer.apple.com > Certificates, IDs & Profiles > Certificates, then re-run this workflow (docs/TESTFLIGHT.md, Troubleshooting)."
            fi
            exit 1
          fi
      - name: Export and upload to TestFlight
        if: steps.saved.outputs.use != 'true'
        run: |
          KEY_FILE="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_FILE" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove the key file and signing keychain
        if: always()
        run: |
          rm -rf "$HOME/private_keys" "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/profile.mobileprovision"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
