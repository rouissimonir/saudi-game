name: iOS simulator build

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-simulator.yml'
      - 'ios/**'
      - 'src/**'
      - 'public/**'
      - 'tools/check-ios-assets*'
      - 'capacitor.config.json'
      - 'index.html'
      - 'fasih.html'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  simulator-build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check and build web app
        run: |
          npm run lint
          npm test
          npm run build
      - name: Sync and audit the iOS bundle
        run: |
          npx cap sync ios
          npm run check:ios-assets
      - name: Compile for iOS simulator
        run: |
          xcodebuild -version
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/qahwa-derived" CODE_SIGNING_ALLOWED=NO build
      - name: Install and launch on an iPhone simulator
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | node -e 'let s=""; process.stdin.on("data", c => s += c); process.stdin.on("end", () => { const d = JSON.parse(s).devices; const phone = Object.entries(d).filter(([runtime]) => runtime.includes("SimRuntime.iOS")).flatMap(([, devices]) => devices).find(device => device.isAvailable && device.name.startsWith("iPhone")); if (!phone) { console.error("No available iPhone simulator"); process.exit(1); } console.log(phone.udid); });')
          xcrun simctl boot "$SIMULATOR_ID"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl install "$SIMULATOR_ID" "$RUNNER_TEMP/qahwa-derived/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl launch "$SIMULATOR_ID" sa.qahwamajlis.merge
          sleep 10
          xcrun simctl io "$SIMULATOR_ID" screenshot "$RUNNER_TEMP/qahwa-simulator.png"
      - name: Save simulator screenshot
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-launch
          path: ${{ runner.temp }}/qahwa-simulator.png
          if-no-files-found: error
